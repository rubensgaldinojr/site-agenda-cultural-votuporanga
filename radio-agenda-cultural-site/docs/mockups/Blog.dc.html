  { categoria: 'Crônicas', titulo: 'Memórias de uma loja de discos que fechou as portas', a: 'fundador', data: '25 set 2026' },
  { categoria: 'Descobertas Musicais', titulo: 'Trilhas de cinema brasileiro que merecem um play', a: 'igor', data: '21 set 2026' },
  { categoria: 'Reflexões', titulo: 'Ler em voz alta: a poesia falada como encontro', a: 'marina', data: '17 set 2026' },
  { categoria: 'Artigos', titulo: 'Festivais de música no interior paulista em novembro', a: 'equipe', data: '13 set 2026' },
  { categoria: 'Podcasts', titulo: 'Bastidores da Cena #31: luthiers do interior', a: 'equipe', data: '09 set 2026' },
].map((p, i) => ({ ...p, i, autor: AUTHORS[p.a].nome, href: `Post.dc.html?p=${i}`, autorHref: `Autor.dc.html?a=${p.a}` }));
const qs = (k) => new URLSearchParams(location.search).get(k);

const CATS = ['Crônicas', 'Descobertas Musicais', 'Reflexões', 'Podcasts', 'Artigos'];
const SORTS = ['Mais recentes primeiro', 'Mais antigos primeiro', 'Título (A–Z)', 'Autor (A–Z)'];
const AUTS = Object.keys(AUTHORS);
const PER = 6, PER_M = 4;
const mod = (a, n) => ((a % n) + n) % n;

class Component extends DCLogic {
  state = { cat: undefined, aut: null, sort: 0, page: 0, pageM: 0, open: null, mf: false };
  componentDidMount() {
    this._close = (e) => { if (this.state.open && !e.target.closest('button')) this.setState({ open: null }); };
    document.addEventListener('click', this._close);
  }
  componentWillUnmount() { document.removeEventListener('click', this._close); }
  dd(id, label, value, opts, cur, onPick) {
    const open = this.state.open === id;
    return {
      label, value, open, chev: open ? 'rotate(180deg)' : 'none',
      border: open ? 'var(--accent)' : 'var(--line)',
      toggle: () => this.setState({ open: open ? null : id }),
      opts: opts.map((o, i) => ({ label: o, check: i === cur ? '✓' : '', bg: i === cur ? 'var(--surface2)' : 'transparent',
        pick: () => { onPick(i); this.setState({ open: null, page: 0, pageM: 0 }); } })),
    };
  }
  renderVals() {
    const init = this.props.categoriaInicial && this.props.categoriaInicial !== 'Todos' ? this.props.categoriaInicial : null;
    const cat = this.state.cat !== undefined ? this.state.cat : (CATS.includes(qs('c')) ? qs('c') : init);
    const aut = this.state.aut;
    let list = POSTS.filter(p => (!cat || p.categoria === cat) && (!aut || p.a === aut));
    const s = this.state.sort;
    list = [...list].sort((a, b) => s === 0 ? a.i - b.i : s === 1 ? b.i - a.i : s === 2 ? a.titulo.localeCompare(b.titulo, 'pt') : a.autor.localeCompare(b.autor, 'pt') || a.i - b.i);
    const nP = Math.max(1, Math.ceil(list.length / PER)), nM = Math.max(1, Math.ceil(list.length / PER_M));
    const page = Math.min(this.state.page, nP - 1), pageM = Math.min(this.state.pageM, nM - 1);
    const pod = cat === 'Podcasts';
    const catOpts = ['Todas as categorias', ...CATS], autOpts = ['Todos os autores', ...AUTS.map(k => AUTHORS[k].nome)];
    const catIdx = cat ? CATS.indexOf(cat) + 1 : 0, autIdx = aut ? AUTS.indexOf(aut) + 1 : 0;
    const setCat = (i) => this.setState({ cat: i ? CATS[i - 1] : null });
    const setAut = (i) => this.setState({ aut: i ? AUTS[i - 1] : null });
    const setSort = (i) => this.setState({ sort: i });
    const nFilters = (cat ? 1 : 0) + (aut ? 1 : 0);
    const tags = [];
    if (cat) tags.push({ label: cat, remove: () => this.setState({ cat: null, page: 0, pageM: 0 }) });
    if (aut) tags.push({ label: AUTHORS[aut].nome, remove: () => this.setState({ aut: null, page: 0, pageM: 0 }) });
    return {
      navActive: pod ? 'Podcasts' : 'Blog',
      eyebrow: pod ? 'Podcasts' : 'Blog',
      title: pod ? 'Conversas para ouvir com calma' : 'Histórias, descobertas e boas conversas',
      lede: pod ? 'Episódios com artistas, curadores e gente que faz a cena cultural do interior paulista.' : 'Crônicas, discos garimpados, reflexões e bastidores da rádio, escritos por quem faz a Agenda Cultural.',
      fCat: this.dd('cat', 'Categoria', catOpts[catIdx], catOpts, catIdx, setCat),
      fAut: this.dd('aut', 'Autor(a)', autOpts[autIdx], autOpts, autIdx, setAut),
      sort: this.dd('sort', 'Ordenar por', SORTS[s], SORTS, s, setSort),
      fCatM: this.dd('catM', 'Categoria', catOpts[catIdx], catOpts, catIdx, setCat),
      fAutM: this.dd('autM', 'Autor(a)', autOpts[autIdx], autOpts, autIdx, setAut),
      sortM: this.dd('sortM', 'Ordenar por', SORTS[s], SORTS, s, setSort),
      hasFilters: nFilters > 0, nFilters, activeTags: tags,
      clear: () => this.setState({ cat: null, aut: null, page: 0, pageM: 0 }),
      mfOpen: this.state.mf, mfBg: this.state.mf ? 'var(--surface2)' : 'var(--surface)',
      toggleMF: () => this.setState(st => ({ mf: !st.mf })),
      countLabel: `${list.length} ${list.length === 1 ? 'post encontrado' : 'posts encontrados'}`,
      pagePosts: list.slice(page * PER, page * PER + PER),
      pages: Array.from({ length: nP }, (_, p) => ({
        label: p + 1, go: () => this.setState({ page: p }),
        bg: p === page ? 'var(--accent-soft)' : 'var(--surface)',
        border: p === page ? 'var(--accent)' : 'var(--line)',
      })),
      prev: () => this.setState({ page: mod(page - 1, nP) }),
      next: () => this.setState({ page: mod(page + 1, nP) }),
      pagePostsM: list.slice(pageM * PER_M, pageM * PER_M + PER_M),
      pageLabelM: `${pageM + 1} de ${nM}`,
      prevM: () => this.setState({ pageM: mod(pageM - 1, nM) }),
      nextM: () => this.setState({ pageM: mod(pageM + 1, nM) }),
    };
  }
}
</script>
</body>
</html>
