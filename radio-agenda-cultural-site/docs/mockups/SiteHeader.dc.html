<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="./tema.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
</helmet>
<div style="position:relative; z-index:30; font-family:'DM Sans',sans-serif;">
  <sc-if value="{{ isDesk }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 40px; border-bottom:1px solid var(--line); background:var(--surface);">
      <a href="Home v4 Claro.dc.html" style="display:flex;"><img src="uploads/cropped-Horizontal-v2.png" alt="agenda cultural" style="height:34px; display:block;"></a>
      <div style="display:flex; align-items:center; gap:28px;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
          <a href="{{ it.href }}" style="position:relative; font-size:14px; font-weight:500; color:{{ it.color }}; padding:4px 0;" style-hover="color:var(--text);">{{ it.label }}<span style="position:absolute; left:0; right:0; bottom:-3px; height:1.5px; border-radius:1px; background:{{ it.line }};"></span></a>
        </sc-for>
        <span style="width:1px; height:22px; background:var(--line);"></span>
        <dc-import name="ThemeToggle" hint-size="132px,36px"></dc-import>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 6px 7px 18px; border-bottom:1px solid var(--line); background:var(--surface);">
      <a href="Home v4 Claro.dc.html" style="display:flex;"><img src="uploads/cropped-Horizontal-v2.png" alt="agenda cultural" style="height:26px; display:block;"></a>
      <div style="display:flex; align-items:center; gap:4px;">
      <dc-import name="ThemeToggle" labels="{{ false }}" hint-size="52px,36px"></dc-import>
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="width:44px; height:44px; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
        <span style="width:20px; height:1.5px; background:var(--text); border-radius:1px;"></span>
        <span style="width:20px; height:1.5px; background:var(--text); border-radius:1px;"></span>
        <span style="width:20px; height:1.5px; background:var(--text); border-radius:1px;"></span>
      </button>
      </div>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; left:0; right:0; top:100%; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:0 20px 30px -20px rgba(60,40,20,.3); padding:4px 18px 14px; display:flex; flex-direction:column;">
        <sc-for list="{{ itemsM }}" as="it" hint-placeholder-count="6">
          <a href="{{ it.href }}" style="display:flex; align-items:center; justify-content:space-between; min-height:48px; font-size:15px; color:{{ it.color }}; border-bottom:1px solid var(--line);">{{ it.label }}<span style="font-size:13px; color:var(--muted);">→</span></a>
        </sc-for>
        <div style="display:flex; align-items:center; justify-content:space-between; min-height:52px;">
          <span style="font-size:13px; color:var(--muted);">Aparência do site</span>
          <dc-import name="ThemeToggle" hint-size="132px,36px"></dc-import>
        </div>
      </div>
    </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Estações&quot;,&quot;options&quot;:[&quot;Estações&quot;,&quot;Blog&quot;,&quot;Literatura&quot;,&quot;Podcasts&quot;,&quot;Sobre&quot;,&quot;Contato&quot;,&quot;&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = [
  { label: 'Estações', href: 'Estacoes.dc.html' },
  { label: 'Blog', href: 'Blog.dc.html' },
  { label: 'Literatura', href: '#' },
  { label: 'Podcasts', href: 'Blog.dc.html?c=Podcasts' },
  { label: 'Sobre', href: 'Sobre.dc.html' },
];
class Component extends DCLogic {
  state = { menu: false };
  renderVals() {
    const active = this.props.active ?? '';
    const map = (n) => ({ ...n, color: n.label === active ? 'var(--text)' : 'var(--text-body)', line: n.label === active ? 'var(--accent)' : 'transparent' });
    return {
      isMobile: !!this.props.mobile, isDesk: !this.props.mobile,
      items: NAV.map(map),
      itemsM: [...NAV, { label: 'Contato', href: 'Contato.dc.html' }].map(map),
      menuOpen: this.state.menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
    };
  }
}
</script>
</body>
</html>
