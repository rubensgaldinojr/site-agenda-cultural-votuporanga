<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="./tema.css">
</helmet>
<button onClick="{{ toggle }}" role="switch" aria-checked="{{ dark }}" aria-label="Alternar entre modo claro e modo escuro" title="Alternar entre modo claro e modo escuro" style="display:flex; align-items:center; gap:8px; padding:4px 0; background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif;">
  <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
    <span style="font-size:11px; font-weight:500; color:{{ lightColor }};">Claro</span>
  </sc-if>
  <span style="position:relative; width:52px; height:28px; flex:none; border-radius:999px; background:var(--surface2); border:1px solid var(--line);">
    <svg style="position:absolute; left:7px; top:6px;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    <svg style="position:absolute; right:7px; top:6px;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    <span style="position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; transform:{{ knobX }}; transition:transform .25s ease;">
      <sc-if value="{{ light }}" hint-placeholder-val="{{ true }}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{ dark }}" hint-placeholder-val="{{ false }}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent-text)" stroke="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </sc-if>
    </span>
  </span>
  <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
    <span style="font-size:11px; font-weight:500; color:{{ darkColor }};">Escuro</span>
  </sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:60},&quot;labels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const KEY = 'rac-tema';
const current = () => document.documentElement.dataset.theme || 'light';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(KEY, t); } catch (e) {}
  window.dispatchEvent(new CustomEvent('rac-tema', { detail: t }));
}
class Component extends DCLogic {
  componentDidMount() {
    if (!document.documentElement.dataset.theme) {
      let t = null;
      try { t = localStorage.getItem(KEY); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      applyTheme(t);
    }
    this._h = () => this.forceUpdate();
    window.addEventListener('rac-tema', this._h);
    this.forceUpdate();
  }
  componentWillUnmount() { window.removeEventListener('rac-tema', this._h); }
  renderVals() {
    const dark = current() === 'dark';
    return {
      dark, light: !dark,
      showLabels: this.props.labels ?? true,
      knobX: dark ? 'translateX(24px)' : 'translateX(0)',
      lightColor: dark ? 'var(--muted)' : 'var(--text)',
      darkColor: dark ? 'var(--text)' : 'var(--muted)',
      toggle: () => applyTheme(dark ? 'light' : 'dark'),
    };
  }
}
</script>
</body>
</html>
